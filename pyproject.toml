[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-roofline-analyzer"
version = "1.0.0"
description = "NPU 静态分析工具：生成大模型算子的 Roofline 模型，指导性能优化"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "NPU Performance Team"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.21",
]
[project.optional-dependencies]
pytorch = ["torch>=2.0"]
onnx = ["onnx>=1.14"]
huggingface = ["transformers>=4.30", "accelerate"]
plot = ["matplotlib>=3.5", "plotly>=5.10"]
dev = ["pytest>=7.0", "black", "ruff", "mypy"]
all = ["torch>=2.0", "onnx>=1.14", "transformers>=4.30", "matplotlib>=3.5", "plotly>=5.10"]

[project.scripts]
npu-roofline = "npu_roofline_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/npu-roofline-analyzer"
Repository = "https://github.com/your-org/npu-roofline-analyzer"
Issues = "https://github.com/your-org/npu-roofline-analyzer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["npu_roofline_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]